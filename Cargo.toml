[package]
name = "updog"
version = "0.1.0"
edition = "2024"

[dependencies]
arrayvec = "0.7.8"
bytemuck = { version = "1.25.2", features = ["derive", "extern_crate_alloc", "zeroable_atomics"] }
clap = { version = "4.6.6", features = ["derive"] }
cozy-chess = "0.3.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
